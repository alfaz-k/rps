<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>Cyber Arena | RPS & Hand Cricket</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@700;900&family=Outfit:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" />
  <link rel="stylesheet" href="style.css" />
  <!-- WebRTC PeerJS CDN -->
  <script src="https://unpkg.com/peerjs@1.5.4/dist/peerjs.min.js"></script>
</head>
<body>
  <div class="ambient-glow"></div>
  <canvas id="particleCanvas"></canvas>

  <!-- LOBBY OVERLAY -->
  <div class="lobby-overlay" id="lobbyScreen">
    <div class="lobby-box">
      <div class="brand">
        <span class="badge">ONLINE ARENA</span>
        <h2>DUEL CLASH</h2>
      </div>

      <div class="game-select-group">
        <label>SELECT GAME</label>
        <div class="mode-toggles">
          <button type="button" class="mode-btn active" data-game="rps">RPS</button>
          <button type="button" class="mode-btn" data-game="cricket">Hand Cricket</button>
        </div>
      </div>

      <div class="field-group">
        <label>YOUR NAME</label>
        <input type="text" id="playerNameInput" placeholder="Player" maxlength="10" />
      </div>

      <div class="field-group">
        <label>ROOM CODE (TO JOIN)</label>
        <input type="text" id="roomCodeInput" placeholder="4-DIGIT CODE" maxlength="6" />
      </div>

      <div class="btn-cluster">
        <button id="createBtn" class="action-btn primary">Create Room</button>
        <button id="joinBtn" class="action-btn secondary">Join Room</button>
      </div>
      <p class="error-text" id="lobbyError"></p>
    </div>
  </div>

  <!-- MAIN VIEWPORT -->
  <div class="game-wrapper">
    <!-- Clean Top Bar -->
    <header class="top-nav">
      <div class="room-indicator">
        <span class="pulse-dot"></span>
        <span id="roomCodeLabel">ROOM: ---</span>
      </div>
      <div class="nav-actions">
        <button id="soundBtn" class="icon-button" aria-label="Sound"><i class="fas fa-volume-up"></i></button>
        <button id="exitBtn" class="icon-button" aria-label="Exit"><i class="fas fa-right-from-bracket"></i></button>
      </div>
    </header>

    <!-- Dashboard: Switches according to game mode -->
    <section class="stat-dashboard" id="statDashboard">
      <!-- Standard RPS Header Dashboard -->
      <div class="rps-scores" id="rpsBoard">
        <div class="side-score">
          <span class="player-name" id="p1NameLabel">YOU</span>
          <span class="score-digit" id="p1Score">0</span>
        </div>
        <div class="center-round">
          <span class="game-badge" id="gameTypeBadge">RPS</span>
          <span class="round-status" id="roundStatusText">Waiting for connection...</span>
        </div>
        <div class="side-score">
          <span class="player-name" id="p2NameLabel">OPPONENT</span>
          <span class="score-digit" id="p2Score">0</span>
        </div>
      </div>

      <!-- Hand Cricket Calculator Dashboard -->
      <div class="cricket-board" id="cricketBoard" style="display: none;">
        <div class="cricket-stats-top">
          <div class="role-pill" id="myCricketRole">BATSMAN</div>
          <div class="score-container">
            <span class="cricket-score" id="cricketRuns">0</span>
            <span class="cricket-wickets" id="cricketWickets">/0</span>
          </div>
          <div class="target-box" id="targetContainer">
            <span class="target-title">TARGET</span>
            <span class="target-num" id="targetScoreDisplay">--</span>
          </div>
        </div>
        <div class="cricket-meta" id="cricketMetaMessage">1st Innings: Set the target!</div>
      </div>
    </section>

    <!-- Visual Arena -->
    <main class="clash-stage">
      <div class="duel-column">
        <div class="hand-card" id="myDisplay">
          <i class="fas fa-hand-back-fist default-icon"></i>
        </div>
        <span class="stage-tag" id="myActionState">Ready</span>
      </div>

      <div class="versus-ring">VS</div>

      <div class="duel-column">
        <div class="hand-card" id="oppDisplay">
          <i class="fas fa-hand-back-fist default-icon"></i>
        </div>
        <span class="stage-tag" id="oppActionState">Waiting...</span>
      </div>
    </main>

    <!-- Live Status Pill -->
    <div class="prompt-bar" id="promptBar">
      <h3 id="promptTitle">MAKE YOUR MOVE</h3>
      <p id="promptSub">Tap an option below</p>
    </div>

    <!-- Dynamic Actions Dock (RPS or 1-6 Cricket Buttons) -->
    <section class="dock-container" id="dockContainer">
      <!-- RPS Controls -->
      <div class="button-deck rps-deck" id="rpsDeck">
        <button class="choice-tile" data-choice="rock">
          <i class="fas fa-hand-back-fist"></i>
          <span>Rock</span>
        </button>
        <button class="choice-tile" data-choice="paper">
          <i class="fas fa-hand"></i>
          <span>Paper</span>
        </button>
        <button class="choice-tile" data-choice="scissors">
          <i class="fas fa-hand-scissors"></i>
          <span>Scissors</span>
        </button>
      </div>

      <!-- Hand Cricket (1 to 6 Only) Controls -->
      <div class="button-deck cricket-deck" id="cricketDeck" style="display: none;">
        <button class="choice-tile num-tile" data-choice="1">1</button>
        <button class="choice-tile num-tile" data-choice="2">2</button>
        <button class="choice-tile num-tile" data-choice="3">3</button>
        <button class="choice-tile num-tile" data-choice="4">4</button>
        <button class="choice-tile num-tile" data-choice="5">5</button>
        <button class="choice-tile num-tile" data-choice="6">6</button>
      </div>
    </section>

    <footer class="app-credit">
      &copy; <span id="yearEl"></span> <strong>Alfaz Kaladagi</strong>. All Rights Reserved.
    </footer>
  </div>

  <!-- End Game Notification Modal -->
  <div class="end-modal" id="endModal">
    <div class="end-modal-box">
      <div class="modal-badge-icon" id="modalBadgeIcon"><i class="fas fa-trophy"></i></div>
      <h2 id="modalWinnerHeading">VICTORY!</h2>
      <p id="modalWinnerDesc">Winner statement goes here.</p>
      <button class="action-btn primary" id="modalResetBtn">Play Again</button>
    </div>
  </div>

  <script src="script.js"></script>
</body>
</html>
