<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>Cyber RPS Online | Multiplayer</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@600;800;900&family=Outfit:wght@300;400;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" />
  <link rel="stylesheet" href="style.css" />
  <!-- Free Global WebRTC P2P Library (No registration or keys required) -->
  <script src="https://unpkg.com/peerjs@1.5.4/dist/peerjs.min.js"></script>
</head>
<body>
  <div class="glow-orb orb-1"></div>
  <div class="glow-orb orb-2"></div>
  <canvas id="particleCanvas"></canvas>

  <!-- LOBBY SCREEN MODAL -->
  <div class="lobby-overlay" id="lobbyScreen">
    <div class="lobby-card">
      <div class="logo">
        <span class="cyber-badge">P2P MULTIPLAYER</span>
        <h1>CLASH OF HANDS</h1>
      </div>
      <p class="lobby-subtitle">Create a room or join your friend's room code</p>

      <div class="lobby-form">
        <div class="input-group">
          <label for="playerNameInput">Your Handle</label>
          <input type="text" id="playerNameInput" placeholder="e.g., Alfaz" maxlength="12" />
        </div>

        <div class="input-group">
          <label for="roomCodeInput">Room Code (Enter to Join)</label>
          <input type="text" id="roomCodeInput" placeholder="e.g., 4-digit code" maxlength="6" style="text-transform:uppercase" />
        </div>

        <div class="lobby-actions">
          <button id="joinBtn" class="primary-btn">Join Room</button>
          <button id="createBtn" class="secondary-btn">Create Room</button>
        </div>
      </div>
      <p class="error-msg" id="lobbyError"></p>
    </div>
  </div>

  <!-- MAIN APP CONTAINER -->
  <div class="app-container">
    <header class="game-header">
      <div class="logo">
        <span class="cyber-badge" id="activeRoomCode">ROOM: ---</span>
        <h1>ARENA DUEL</h1>
      </div>

      <div class="controls-bar">
        <button id="soundToggle" class="icon-circle-btn" aria-label="Toggle Sound">
          <i class="fas fa-volume-up"></i>
        </button>
        <button id="leaveRoomBtn" class="icon-circle-btn" title="Exit Match">
          <i class="fas fa-arrow-right-from-bracket"></i>
        </button>
      </div>
    </header>

    <!-- Scoreboard -->
    <section class="scoreboard-wrapper">
      <div class="score-card player-card">
        <span class="badge" id="player1Name">YOU</span>
        <div class="score-number" id="player1Score">0</div>
        <div class="match-pips" id="player1Pips"></div>
      </div>

      <div class="match-info-center">
        <div class="match-badge">BEST OF 5</div>
        <div class="status-indicator" id="roomStatusText">Connecting...</div>
      </div>

      <div class="score-card bot-card">
        <span class="badge" id="player2Name">OPPONENT</span>
        <div class="score-number" id="player2Score">0</div>
        <div class="match-pips" id="player2Pips"></div>
      </div>
    </section>

    <!-- Battle Stage -->
    <main class="battle-stage">
      <div class="fighter player-fighter">
        <div class="hand-display" id="myHand">
          <i class="fas fa-fist-raised default-icon"></i>
        </div>
        <span class="fighter-tag" id="myStatusTag">Your Move</span>
      </div>

      <div class="vs-divider">
        <span class="vs-text">VS</span>
      </div>

      <div class="fighter bot-fighter">
        <div class="hand-display" id="opponentHand">
          <i class="fas fa-fist-raised default-icon"></i>
        </div>
        <span class="fighter-tag" id="opponentStatusTag">Waiting...</span>
      </div>
    </main>

    <!-- Result Announcement Banner -->
    <div class="result-banner" id="resultBanner">
      <h2 id="resultTitle">LOCK YOUR CHOICE</h2>
      <p id="resultSubtitle">Tap an action below to strike</p>
    </div>

    <!-- Actions Dock -->
    <section class="action-dock">
      <button class="choice-btn" data-choice="rock" aria-label="Pick Rock">
        <div class="icon-wrap"><i class="fas fa-hand-back-fist"></i></div>
        <span class="btn-name">Rock</span>
      </button>

      <button class="choice-btn" data-choice="paper" aria-label="Pick Paper">
        <div class="icon-wrap"><i class="fas fa-hand"></i></div>
        <span class="btn-name">Paper</span>
      </button>

      <button class="choice-btn" data-choice="scissors" aria-label="Pick Scissors">
        <div class="icon-wrap"><i class="fas fa-hand-scissors"></i></div>
        <span class="btn-name">Scissors</span>
      </button>
    </section>

    <!-- Footer with Copyright -->
    <footer class="app-footer">
      <p>&copy; <span id="currentYear"></span> <strong>Alfaz Kaladagi</strong>. All Rights Reserved.</p>
    </footer>
  </div>

  <!-- End of Match Series Modal -->
  <div class="modal-overlay" id="matchModal">
    <div class="modal-card">
      <div class="modal-icon" id="modalIcon"><i class="fas fa-crown"></i></div>
      <h2 id="modalTitle">CHAMPION!</h2>
      <p id="modalDesc">Series concluded.</p>
      <button class="modal-btn" id="modalPlayAgain">Play Again</button>
    </div>
  </div>

  <script src="script.js"></script>
</body>
</html>
